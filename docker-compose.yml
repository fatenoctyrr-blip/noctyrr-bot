services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oyunlar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oyunlar"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    environment:
      BOT_API_TOKEN: ${BOT_API_TOKEN:?BOT_API_TOKEN is required}
      GRAND_ADMIN_ID: ${GRAND_ADMIN_ID:?GRAND_ADMIN_ID is required}
      DEFAULT_CHANNEL_ID: ${DEFAULT_CHANNEL_ID:-}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/oyunlar
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-true}
      CONTEST_POLL_SECONDS: ${CONTEST_POLL_SECONDS:-30}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-12}
      DB_RETRY_SECONDS: ${DB_RETRY_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: