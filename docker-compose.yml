services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oyunlar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  bot:
    build: .
    environment:
      BOT_API_TOKEN: ${BOT_API_TOKEN:?BOT_API_TOKEN is required}
      GRAND_ADMIN_ID: ${GRAND_ADMIN_ID:-8126409678}
      DEFAULT_CHANNEL_ID: ${DEFAULT_CHANNEL_ID:-4354232618}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/oyunlar
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-true}
      CONTEST_POLL_SECONDS: ${CONTEST_POLL_SECONDS:-30}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data: